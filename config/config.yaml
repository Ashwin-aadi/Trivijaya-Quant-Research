# Single source of truth for every parameter in the lab.
# Nothing numeric should be hard-coded in source files; it lives here.
#
# Values tagged "PROPOSED — pending PI sign-off at Checkpoint 1.0" are the defaults put forward
# for approval. They are used so the pipeline runs, but they are not settled until the checkpoint
# is signed off and the decision is recorded in DECISIONS.md.

meta:
  seed: 42                      # global seed; every stochastic op takes an explicit seed
  project: trivijaya-quant-research

paths:
  data_raw: data/raw           # immutable, write-once, each file has a .meta.json sibling
  data_interim: data/interim   # regenerable intermediates
  data_processed: data/processed
  runs: runs                   # one dir per execution, each with a manifest.json

calendar:
  exchange: NSE
  # Trading sessions are derived from NIFTY 100 index levels, not from a hand-typed holiday list:
  # the index has a value on exactly the days the market traded. Deliberately independent of the
  # stock price source so the "no price rows on holidays" test stays a real cross-check.
  # Special sessions (Muhurat, budget-day Saturdays) are preserved, never filtered as anomalies.
  history_start: "2019-01-01"   # a year before dev_start, so trailing windows have history
  index_symbol: "^CNX100"       # yfinance ticker for the NIFTY 100 index

dates:
  # Approved 2026-07-25 (revised after the data-availability halt). Development is what we fit,
  # tune, and inspect. The holdout is never touched until a project's final experimental phase,
  # and only with logged PI authorization (charter RULE 7).
  dev_start: "2020-01-01"
  dev_end: "2024-12-31"
  holdout_start: "2025-01-01"  # everything from here on is sacred / never-touched
  # Frozen 2026-07-31, BEFORE any holdout data was fetched, and deliberately set to a calendar
  # boundary rather than to the latest available session. Left open, the window length would be a
  # researcher degree of freedom; chosen after seeing a result, it would be the exact pathology
  # this lab exists to detect. One clean year, ~248 sessions. PI-approved.
  holdout_end: "2025-12-31"

universe:
  # Rules-based liquidity universe ("Option B", approved 2026-07-25). At each rebalance date the
  # universe is the top `size` NSE equities by trailing median daily traded value, computed using
  # only sessions strictly before that date. Survivorship-free by construction: nothing consults a
  # published membership list, so stocks that later delist simply stop qualifying rather than
  # vanishing from history.
  #
  # NOT the NIFTY 100. Results must never be labelled as such — this is a liquidity proxy.
  method: liquidity_rank
  size: 100
  # --- The four parameters below are PROPOSED DEFAULTS awaiting PI ratification at Checkpoint 1.0.
  # They are real methodological choices, not implementation details.
  #
  # (1) Trailing window over which median traded value is measured. 126 sessions ~ 6 months.
  #     6 months smooths one-off spikes (a single block deal can lift 3-month traded value for
  #     weeks) while still adapting within a year.
  trailing_sessions: 126
  # (2) Rebalance frequency. Quarterly matches real index practice and keeps turnover — and
  #     therefore transaction costs, which Phase 1.1 models in detail — far below monthly.
  rebalance: quarterly
  # (3) Buffer bands. Without a buffer, stocks near rank `size` churn in and out every rebalance,
  #     generating spurious turnover and cost. A name must rank at least as high as `entry_rank`
  #     to join, and an incumbent is only dropped once it falls past `exit_rank`.
  entry_rank: 90
  exit_rank: 110
  # (4) Minimum listing history. A stock needs the full trailing window to have a meaningful
  #     traded-value estimate, and must actually have traded on most of it (filters dormant
  #     listings). Freshly-listed names are ineligible until they accumulate the window; this is
  #     a stated scope limitation, not a bias — the rule is applied identically at every date
  #     using only past data.
  min_listed_sessions: 126
  min_traded_fraction: 0.8

audit:
  # Parameters for the semantic audit layer (src/audit/semantic.py), which asks a local model to
  # read a strategy's stated rationale against the code that implements it.
  #
  # The model tag is the single most reproducibility-load-bearing value in this file. A semantic
  # label is a judgment, not a computation: it is only reproducible against a pinned tag with a
  # pinned quantization. Ollama tags move, and a re-pull can change every label in the corpus
  # without changing a line of our code. The tag is therefore recorded on each finding and written
  # into the run manifest; it is not changed without PI approval (charter RULE 5).
  model_tag: "qwen2.5:7b-instruct-q4_K_M"
  # Local inference only. No paid service is contacted from this repository.
  ollama_host: "http://localhost:11434"
  # Context window, pinned rather than left to the server default, which varies with the Ollama
  # build. A smaller window would silently truncate the strategy source out of the prompt and the
  # model would then label an item it was never shown. Sized to hold the clip limits that
  # src/audit/prompts.py applies to the rationale and the source.
  num_ctx: 4096
  # A 7B model on CPU can take well over a minute per item. Generous on purpose: a timeout raises
  # and loses the item, which costs more than waiting does.
  request_timeout_seconds: 180.0
  # Reachability probe only, so it fails fast — it produces no label and nothing is lost by it.
  probe_timeout_seconds: 2.0

costs:
  # ---------------------------------------------------------------------------------------------
  # Indian equity transaction costs. Phase 1.1.
  #
  # EVERY statutory rate below was looked up from a citable source on 2026-07-31 and is recorded
  # with its effective date. None is guessed. Rates are time-varying and move with Union Budgets
  # and SEBI/exchange circulars, so a stale value here silently corrupts every net figure
  # downstream -- `effective_from` exists so that staleness is visible rather than assumed away.
  #
  # Sources:
  #   STT            https://www.nseclearing.in/clearing-settlement/equity-derivatives/securities-transaction-tax
  #                  Budget 2026 raised STT on futures (0.05%) and options (0.15%) from 2026-04-01
  #                  but left EQUITY DELIVERY UNCHANGED at 0.1% both sides.
  #   NSE txn charge NSE circular, cash market, effective 2024-10-01, pursuant to SEBI circular
  #                  SEBI/HO/MRD/TPD-1/P/CIR/2024/92 dated 2024-07-01 (uniform charges for all
  #                  members). Revised down from 0.00322%.
  #   NSE IPFT       Investor Protection Fund Trust, cash equities, Rs 10/crore, from 2023-04-01.
  #   SEBI fee       Rs 10 per crore of turnover.
  #   Stamp duty     Uniform nationwide regime under the Indian Stamp Act from 2020-07-01:
  #                  0.015% (Rs 1500/crore) on DELIVERY BUY; 0.003% on intraday buy.
  #   GST            18% on (brokerage + exchange transaction charges + SEBI fee + IPFT).
  #
  # Cross-check: Zerodha quotes a single "0.00307%" NSE transaction charge where Upstox quotes
  # "0.00297%". Both are correct -- Zerodha bundles the 0.0001% IPFT into the same line. They are
  # kept separate here so each traces to its own circular.
  # ---------------------------------------------------------------------------------------------
  effective_from: "2026-04-01"      # newest effective date among the rates below
  verified_on: "2026-07-31"

  delivery:
    stt_buy: 0.001                  # 0.1%
    stt_sell: 0.001                 # 0.1%
    stamp_duty_buy: 0.00015         # 0.015%, buy side only
    stamp_duty_sell: 0.0
  intraday:
    stt_buy: 0.0                    # intraday STT is sell-side only
    stt_sell: 0.00025               # 0.025%
    stamp_duty_buy: 0.00003         # 0.003%, buy side only
    stamp_duty_sell: 0.0

  # Applied to both sides in both segments.
  exchange_transaction_charge: 0.0000297   # 0.00297%, NSE cash market
  ipft_charge: 0.000001                    # 0.0001%  (Rs 10 / crore)
  sebi_turnover_fee: 0.000001              # 0.0001%  (Rs 10 / crore)
  gst_rate: 0.18                           # on brokerage + exchange + SEBI + IPFT

  brokerage:
    # Discount-broker default. Zero-brokerage delivery is the prevailing market default (Zerodha,
    # Upstox and others); intraday is typically the lesser of a percentage and a flat cap.
    delivery_rate: 0.0
    delivery_flat: 0.0
    intraday_rate: 0.0003           # 0.03%
    intraday_flat_cap: 20.0         # rupees per executed order, whichever is lower

  # Depository charge, levied per scrip on the SELL leg only and NOT proportional to value. This
  # is part statutory (CDSL) and part broker markup, so it is separated from the statutory block.
  # It matters disproportionately for small positions, which is exactly the regime a diversified
  # backtest lives in.
  dp_charge_per_scrip_sell: 3.50    # CDSL component only; broker markup excluded by default

  slippage:
    # Volume-participation model. A flat basis-point assumption is explicitly NOT acceptable per
    # the charter: cost must rise with order size as a fraction of that day's volume.
    #   slippage_fraction = coefficient * participation_rate
    # where participation_rate = order_value / day's traded value.
    # ASSUMPTION, not a measured Indian parameter. See the docstring in src/costs/india.py.
    participation_coefficient: 0.1
    max_slippage_fraction: 0.05     # a hard cap; beyond this the fill is not credible at all

  impact:
    # Square-root law: impact = coefficient * volatility * sqrt(participation_rate).
    # ASSUMPTION. The functional form is standard (Almgren et al.); the coefficient is not
    # calibrated to Indian data and must not be presented as if it were.
    coefficient: 1.0
    default_volatility: 0.02        # daily, used when a per-stock estimate is unavailable

constraints:
  max_participation_rate: 0.01      # a strategy may not consume more than 1% of a day's volume
  min_adv_rupees: 10000000.0        # 1 crore minimum average daily traded value
  adv_window_sessions: 21
  circuit_band: 0.20                # +/-20% price band; no fill outside it

data:
  prices:
    # Approved 2026-07-25 as the default, provisional until the measured discrepancy rate is
    # reported. yfinance is retained purely as an independent cross-check.
    authoritative_source: bhavcopy
    # Tolerance (relative) beyond which a bhavcopy/yfinance disagreement is flagged, not averaged.
    cross_check_rel_tol: 0.01
    # If the share of compared stock-days exceeding that tolerance rises above this, halt and
    # show the worst offenders — that pattern means a broken corporate-action adjustment, not noise.
    max_discrepancy_rate: 0.03
