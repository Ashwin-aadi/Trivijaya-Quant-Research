# Single source of truth for every parameter in the lab.
# Nothing numeric should be hard-coded in source files; it lives here.
#
# Values tagged "PROPOSED — pending PI sign-off at Checkpoint 1.0" are the defaults put forward
# for approval. They are used so the pipeline runs, but they are not settled until the checkpoint
# is signed off and the decision is recorded in DECISIONS.md.

meta:
  seed: 42                      # global seed; every stochastic op takes an explicit seed
  project: trivijaya-quant-research

paths:
  data_raw: data/raw           # immutable, write-once, each file has a .meta.json sibling
  data_interim: data/interim   # regenerable intermediates
  data_processed: data/processed
  runs: runs                   # one dir per execution, each with a manifest.json

calendar:
  exchange: NSE
  # First date the calendar and all downstream data cover.
  history_start: "2015-01-01"

dates:
  # Approved 2026-07-25. Development is what we fit, tune, and inspect. The holdout is never
  # touched until a project's final experimental phase, and only with logged PI authorization
  # (charter RULE 7). Holdout deliberately spans 2025 onward: it contains a real correction and
  # volatility spike, so it punishes fragile strategies rather than flattering them.
  dev_start: "2015-01-01"
  dev_end: "2024-12-31"
  holdout_start: "2025-01-01"  # everything from here on is sacred / never-touched

universe:
  # Approved 2026-07-25: NIFTY 100. A 50-name cross-section was rejected as too thin for the
  # downstream factor and fragility work (quantile buckets would be mostly noise).
  index: nifty100
  size: 100                    # fixed index size; enforced as an invariant on every date
  # Point-in-time membership is the single most important correctness requirement (charter §1.0).
  # Built by event-chain reconstruction: a base constituent list plus every dated reconstitution
  # event, so stocks later removed or delisted remain in the historical universes.
  membership_source: event_chain
  # A stock must clear this median-ADV floor (INR) to be tradable on a given date.
  # PROPOSED — a liquidity screen, not yet approved.
  min_median_adv_inr: 10000000  # 1 crore

data:
  prices:
    # Approved 2026-07-25 as the default, provisional until the measured discrepancy rate is
    # reported. yfinance is retained purely as an independent cross-check.
    authoritative_source: bhavcopy
    # Tolerance (relative) beyond which a bhavcopy/yfinance disagreement is flagged, not averaged.
    cross_check_rel_tol: 0.01
    # If the share of compared stock-days exceeding that tolerance rises above this, halt and
    # show the worst offenders — that pattern means a broken corporate-action adjustment, not noise.
    max_discrepancy_rate: 0.03
