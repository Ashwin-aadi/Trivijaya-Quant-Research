[project]
name = "trivijaya-quant-research"
version = "0.1.0"
description = "Measurement infrastructure for quantitative research on Indian equities."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Frozen research artifacts, exempt from linting because linting them would destroy them.
#
# These directories hold machine-generated strategy source exactly as the model emitted it. The
# static auditor parsed these bytes, and every leak-class count in the paper describes them. Running
# `ruff --fix` here would rewrite the very source the published numbers are a measurement of — the
# result would no longer be reproducible from the artifact, and the artifact would no longer be
# evidence of what the generator produced. They are data, not code we maintain.
exclude = [
    "benchmarks/alphaaudit/survivors/",
    "tests/fixtures/locked/",
]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, B: bugbear, UP: pyupgrade,
# ANN: annotations (we require full type hints), SIM: simplify.
select = ["E", "F", "I", "B", "UP", "ANN", "SIM"]

[tool.ruff.lint.isort]
# Our own package, so imports from it group separately from third-party.
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Tests use fixtures and assertions where annotations add nothing.
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src", "tests"]
# See the note on the locked corpus below for why this directory is exempt.
exclude = ["^tests/fixtures/locked/"]
# Third-party data libraries ship without stubs; don't fail the whole run on them.
[[tool.mypy.overrides]]
module = ["yfinance.*", "jugaad_data.*", "nsepython.*", "hmmlearn.*", "sklearn.*"]
ignore_missing_imports = true

# The locked evaluation corpus is exempt from type checking, for two reasons.
#
# These files are never imported or executed. Nothing collects them; the static auditor parses them
# as text and walks the syntax tree, so a type error in one cannot affect any result.
#
# More importantly, they must not be edited. They were written by processes deliberately blocked
# from seeing the detector source, and the auditor was frozen before the first one existed. Editing
# them afterwards — even to satisfy a type checker — would be a change made by someone who has read
# the detectors, which is the contamination the isolation was built to prevent. The errors are
# polars stub artifacts anyway: `Series.mean()` returns a wide union, and mypy enumerates every
# member combination, so one arithmetic line produces ninety-two of them.
#
# `src/` remains fully strict, as do the other fixture directories.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]   # so `import src...` resolves from the repo root
